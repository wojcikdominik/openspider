# Rust-Toolchain des Workspaces (M2-F01, docs/plan/M2.md 2a C3). Die Version ist festgeschrieben und steht gleich
# in allen Workflows (`toolchain:` bei `dtolnay/rust-toolchain`); beides zusammen anheben. Die kleinste unterstützte
# Version steht in `workspace.package.rust-version` (Cargo.toml).
# 1.100.0 braucht vorher: Clippy `needless_bool` (os-parity) und die Tests, die Hilfsprogramme über die Lage im
# target-Verzeichnis suchen (os-engine lifecycle_crash, os-mcp m2_process).
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
