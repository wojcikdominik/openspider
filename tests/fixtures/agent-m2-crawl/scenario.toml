[[route]]
path = "/robots.txt"
content_type = "text/plain"
body = "User-agent: *\nAllow: /\n"

[[route]]
path = "/"
body = '<!doctype html><html><head><title>MCP fixture</title></head><body><h1>Start</h1><a href="/page">Page</a></body></html>'

[[route]]
path = "/page"
body = '<!doctype html><html><head><title>Page</title></head><body><h1>Page</h1></body></html>'

[[route]]
path = "/redirect"
status = 302
location = "http://169.254.169.254/latest/meta-data/"

[[route]]
path = "/slow"
delay_ms = 100
body = '<html><head><title>Slow</title></head><body><a href="/slow/2">Next</a></body></html>'

[[route]]
path = "/slow/2"
delay_ms = 100
body = '<html><head><title>Slow two</title></head><body>Done</body></html>'

# B4-RESUME (AGENT-020, CRAWL-126): pause_crawl/resume_crawl/stop_crawl. `/held` hält die erste Seiten-Antwort 3 s
# (die Pause wartet auf sie und bleibt so lange „busy“); danach eine Kette, die bei 2 URLs/s mindestens 6 s braucht
# und daher vor Pause oder Stopp nicht von selbst enden kann (B3-FLAKES: Fixture ohne natürliches Ende).
[[route]]
path = "/held"
delay_ms = 3000
body = '<html><head><title>Held</title></head><body><a href="/chain/1">Chain</a></body></html>'

[[route]]
path = "/chain/1"
delay_ms = 100
body = '<html><head><title>Chain 1</title></head><body><a href="/chain/2">Next</a></body></html>'

