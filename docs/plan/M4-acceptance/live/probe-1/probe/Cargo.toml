# M4-Q00: frühe Live-Probe gegen Anthropic, OpenAI (Responses, Decisions) und OpenRouter.
# Eigenständig: gehört nicht zum Haupt-Workspace (leere Tabelle unten). Versionen und Features der Abhängigkeiten
# entsprechen exakt `[workspace.dependencies]` der Wurzel-Cargo.toml; Cargo.lock ist die gekürzte Wurzel-Lock.
[package]
name = "openspider-live-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "OpenSpider M4-Q00: Live-Probe der KI-Anbieter-APIs gegen docs/spec/08-ai.md"

[workspace]

[lib]
name = "probe"
path = "src/lib.rs"

[[bin]]
name = "openspider-live-probe"
path = "src/main.rs"

[dependencies]
os-ai = { path = "../../../../../../crates/os-ai" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "socks", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
