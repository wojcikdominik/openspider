name: Resources nightly
on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      OPENSPIDER_SECRET_STORE: memory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resource pause and consistent resume
        run: cargo test -p os-engine --test memory_m2 --locked
      - name: One million URLs (OUT-267)
        run: cargo run --release -p os-loadtest --locked -- run --scenario perf-001 --size large --out target/resources/report.json
      - name: Enforce 2 GiB RSS limit
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('target/resources/report.json'))
          def rss(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == 'crawler_peak_rss_bytes': yield item
                      else: yield from rss(item)
              elif isinstance(value, list):
                  for item in value: yield from rss(item)
          values = list(rss(report))
          assert values and all(0 < value < 2 * 1024**3 for value in values), values
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-report
          path: target/resources/
