name: ui-e2e

# E2E-A „Frontend + Kern“ (docs/plan/M2.md 3.8, M2-ui-concept 7.3): Playwright gegen das Vite-Frontend, IPC über die
# E2E-Bridge `os-app-bridge` (Feature `e2e-bridge`). WebKit (≈ WKWebView) auf macOS (macos-15, siehe Matrix), Chromium (≈ WebView2) auf
# windows-latest, beide Engines auf ubuntu-latest (Cloud-Variante, Linux).
#
# OS_E2E_TRANSPORT: `bridge` verlangt die echte Bridge, `mock` läuft ohne Kern, `auto` nimmt die Bridge, wenn sie startet.
# Solange `os-app-bridge` ein Stub ist (M2-F03 nicht gemergt), fällt `auto` auf den Mock zurück; der Schritt
# „Transport“ nennt in der Zusammenfassung, was gelaufen ist. Nach dem Merge von M2-F03 stellt der Orchestrator
# OS_E2E_TRANSPORT auf `bridge` um.

on:
  push:
    # Paketbranches (m2/<kurz-id>) laufen ohne Pull-Request mit (Definition of Done: CI-Matrix des Branches grün)
    branches: [main, "m2/**"]
    # Schmale Positivliste (K2-67: Markdown und assets lösen keinen Lauf aus; die Ausschlüsse stehen am Ende).
    paths: &ui-paths
      - "apps/desktop/**"
      - "crates/os-app/**"
      - "crates/os-model/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-e2e.yml"
      - "!**/*.md"
      - "!assets/**"
  pull_request:
    paths: *ui-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  OS_E2E_TRANSPORT: auto

jobs:
  e2e-a:
    name: e2e-a (${{ matrix.name }})
    # Pull-Requests von m2/*-Zweigen überspringen den Job: derselbe Stand läuft schon über den Push-Lauf (K2-67, keine Doppelläufe).
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'm2/') }}
    runs-on: ${{ matrix.os }}
    # macos-webkit brauchte mit 500 Specs auf einem Worker 51–60 min (int-24, Lauf 41338132247; zuletzt 41496427535: 57 min)
    # und läuft deshalb in zwei Shards (`matrix.shard`). Testbudgets und Timeouts der Specs bleiben unverändert (K2-63).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 statt macos-14: der für macOS 14 eingefrorene Playwright-WebKit-Build meldet
          # „Page.overrideSetting: Unknown setting: PushAPIEnabled“ und startet keine Seite (Lauf 39024277294).
          # Zwei Shards statt eines Jobs mit 50–60 min. Das Perf-Projekt (UI-146) läuft nur im ersten, kürzeren Shard
          # (Lauf 41535769537: Shard 1 20 min, Shard 2 29 min Testzeit).
          - name: macos-webkit-1
            os: macos-15
            projects: webkit
            browsers: webkit
            shard: 1/2
            perf: true
            timeout: 60
          - name: macos-webkit-2
            os: macos-15
            projects: webkit
            browsers: webkit
            shard: 2/2
            timeout: 60
          - name: windows-chromium
            os: windows-latest
            projects: chromium
            browsers: chromium
            timeout: 60
          - name: linux-chromium
            os: ubuntu-latest
            projects: chromium
            browsers: chromium
            timeout: 60
          # linux-webkit überschritt mit 566 Specs das Schritt-Limit von 50 min (Lauf 42309492668), deshalb wie macOS zwei Shards.
          - name: linux-webkit-1
            os: ubuntu-latest
            projects: webkit
            browsers: webkit
            shard: 1/2
            timeout: 60
          - name: linux-webkit-2
            os: ubuntu-latest
            projects: webkit
            browsers: webkit
            shard: 2/2
            timeout: 60
          # Lag-Prüfungen B4-LIVEDETAIL (UI-018: Zähler/Chip und Inlinks bei 3 URL/s), je Engine und Plattform ein eigener Job: Die beiden
          # Tests brauchen über eine Minute Zufluss plus Schlussfenster; in den Hauptjobs lagen linux-/windows-chromium schon bei 41–43 min
          # des 50-min-Schritt-Limits. `OS_E2E_LAG=split` (Schritt E2E-A) verlegt sie aus dem Hauptprojekt in `<engine>-lag`; kein Test entfällt.
          - name: macos-webkit-lag
            os: macos-15
            projects: webkit
            browsers: webkit
            lag: true
            timeout: 30
          - name: windows-chromium-lag
            os: windows-latest
            projects: chromium
            browsers: chromium
            lag: true
            timeout: 30
          - name: linux-chromium-lag
            os: ubuntu-latest
            projects: chromium
            browsers: chromium
            lag: true
            timeout: 30
          - name: linux-webkit-lag
            os: ubuntu-latest
            projects: webkit
            browsers: webkit
            lag: true
            timeout: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-e2e

      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: npm

      # Ubuntu 24.04 sperrt unprivilegierte User-Namespaces per AppArmor; ohne sie startet die Chromium-Sandbox des
      # Login-Fensters (os-render, ohne --no-sandbox) nicht und der Start hängt bis zum Launch-Timeout.
      - name: Chromium-Sandbox erlauben (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: npm ci
        run: npm ci

      - name: Playwright-Browser installieren
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install --with-deps ${{ matrix.browsers }}
          else
            npx playwright install ${{ matrix.browsers }}
          fi

      - name: os-app-bridge bauen
        run: cargo build --locked -p os-app --features e2e-bridge --bin os-app-bridge

      # beta/* und mcp/bridge brauchen os-testsite; alpha/support.ts braucht zusätzlich CLI und Paritätswerkzeug.
      # Cargo erzeugt unter Windows .exe; die Fixtures lösen die Namen plattformneutral auf.
      - name: E2E-Fixture-Werkzeuge bauen
        run: cargo build --locked -p os-testsite -p os-cli -p os-parity --bins

      # N17: WebKit übernimmt auf macOS die native Tastaturnavigation. Ohne sie überspringt Tab native Buttons
      # (auch in der isolierten Grid-Fixture). UI-126 prüft weiterhin echte Tab-Tasten und alle Zustandsmerkmale.
      # https://github.com/microsoft/playwright/issues/41808
      - name: WebKit-Tastaturnavigation einschalten (macOS)
        if: runner.os == 'macOS'
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2

      # Schritt-Limit unter dem Job-Limit (B3-MACIMG): läuft der Testlauf zu lange, bleibt Zeit für den Upload von Log,
      # Report und test-results (Fehlertexte in */error-context.md und den Traces). Testzeit zuletzt 24–34 min.
      - name: E2E-A
        timeout-minutes: 50
        env:
          OS_E2E_PROJECTS: ${{ matrix.projects }}
          # Lag-Prüfungen B4-LIVEDETAIL nur im Projekt `<engine>-lag` (Jobs `*-lag`), nicht im Hauptprojekt (siehe playwright.config.ts).
          OS_E2E_LAG: split
          CI: "true"
          # Die Bridge-Binärdatei liegt im Workspace-Zielordner; der Pfad wird von e2e/support/bridge.ts gefunden.
        # Mit Shard nur das Hauptprojekt: `<engine>-perf` hängt davon ab, und Playwright teilt nur Projekte ohne
        # Abhängige auf; die Abhängigkeit liefe sonst ungeteilt in jedem Shard mit. Ohne Shard laufen Haupt- und Perf-Projekt
        # (wie zuvor `npm run e2e`), aber nicht `<engine>-lag`: das Projekt gehört dem eigenen Job.
        run: |
          if [ -n "${{ matrix.lag }}" ]; then
            npm run -w apps/desktop e2e -- --project=${{ matrix.projects }}-lag 2>&1 | tee e2e.log
          elif [ -n "${{ matrix.shard }}" ]; then
            npm run -w apps/desktop e2e -- --project=${{ matrix.projects }} --shard=${{ matrix.shard }} 2>&1 | tee e2e.log
          else
            npm run -w apps/desktop e2e -- --project=${{ matrix.projects }} --project=${{ matrix.projects }}-perf 2>&1 | tee e2e.log
          fi

      # Laufzeitbudgets (UI-146) wie bisher nach den übrigen Tests (hier: des Shards) und ohne parallele Last, ohne die
      # Projektabhängigkeit (--no-deps). Eigene Ausgabeordner, damit Report und Traces des Hauptlaufs erhalten bleiben.
      - name: E2E-A Laufzeitbudgets (Shard)
        if: matrix.perf
        timeout-minutes: 10
        env:
          OS_E2E_PROJECTS: ${{ matrix.projects }}
          CI: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-perf
        run: npm run -w apps/desktop e2e -- --project=${{ matrix.projects }}-perf --no-deps --output=test-results-perf 2>&1 | tee -a e2e.log

      # Die Transport-Zeile steht nicht in jedem Log (ein Shard kann ohne sie auskommen); fehlt sie, darf der Schritt
      # nicht scheitern (grep endet sonst mit pipefail auf 1).
      - name: Transport
        if: always()
        run: |
          used=$( (grep -h '^\[e2e\] Transport:' e2e.log || true) | sort -u | tr '\n' ' ')
          echo "E2E-A (${{ matrix.name }}): ${used:-keine Transport-Zeile im Log}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            e2e.log
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            apps/desktop/playwright-report-perf/
            apps/desktop/test-results-perf/
          if-no-files-found: ignore
