name: integrations

on:
  push:
    paths:
      - integrations/**
      - crates/os-mcp/**
      - crates/os-cli/**
      - tests/fixtures/out-basic-site/**
      - tests/fixtures/out-redirects/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/integrations.yml
  pull_request:
    paths:
      - integrations/**
      - crates/os-mcp/**
      - crates/os-cli/**
      - tests/fixtures/out-basic-site/**
      - tests/fixtures/out-redirects/**
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/integrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  OPENSPIDER_SECRET_STORE: memory
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  marketplace:
    name: Skill and marketplace (${{ matrix.os }})
    # K2-67: Pull-Requests von m2/*-Zweigen überspringen den Job (macOS-Slots): derselbe Stand läuft schon über den Push-Lauf.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'm2/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Integration dependencies (locked)
        run: npm ci --prefix integrations
      - name: Format, schemas, references and tool catalog
        run: npm run --prefix integrations validate
      - name: Contract and launcher tests
        run: npm test --prefix integrations
      - name: Build CLI and fixture server
        run: cargo build --locked -p os-cli -p os-testsite --bins
      - name: Claude Code validation tool
        run: |
          npm install --prefix "$RUNNER_TEMP/openspider-claude" --no-audit --no-fund @anthropic-ai/claude-code@2.1.303
          echo "OPENSPIDER_CLAUDE_BINARY=$RUNNER_TEMP/openspider-claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe" >> "$GITHUB_ENV"
      - name: Marketplace installation, installed slash command and MCP fixture (AGENT-042)
        run: npm run --prefix integrations smoke
      - name: Optional skill evaluation report (AGENT-041)
        if: always()
        run: npm run --prefix integrations eval:report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integrations-eval-${{ matrix.os }}
          path: |
            target/integrations/eval-report.json
            target/integrations/slash-smoke.json
          if-no-files-found: error
