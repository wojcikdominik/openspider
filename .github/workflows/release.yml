name: Release orchestration

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Vorbereiteter Tag; muss zur Workspace-Version passen (z.B. v1.0.0-beta.0)'
        required: true
        type: string
      dry_run:
        description: 'Nur Actions-Artefakte; keinen GitHub-Entwurf anlegen'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-orchestration-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: '0'
  OPENSPIDER_SECRET_STORE: memory

jobs:
  licenses:
    needs: prepare
    uses: ./.github/workflows/licenses.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Versionsgleichstand und Tag prüfen
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          node scripts/release/check-version.mjs
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { checkVersion } from './scripts/release/check-version.mjs';
          const version = checkVersion(process.cwd());
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag und Workspace-Version unterscheiden sich');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nchannel=${version.includes('-') ? 'beta' : 'stable'}\ntag=v${version}\n`);
          JS
          if [[ "$DRY_RUN" != true ]]; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      # UI-127 (Nutzerentscheidung 09.11.2026): Build-Nummer = Anzahl der Commits bis zum gebauten Stand. Nur hier
      # ermittelt (vollständiger Checkout, fetch-depth: 0) und an alle Bau-Jobs weitergegeben, damit alle Plattformen
      # dieselbe Nummer bekommen. Ein flacher Checkout zählt falsch; ohne gültige Nummer ist der Release-Lauf rot.
      - name: Build-Nummer ermitteln (UI-127)
        id: build
        run: |
          set -euo pipefail
          fail() { echo "::error title=Build-Nummer::$1"; echo "$1" >&2; exit 1; }
          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || fail "Flacher Checkout: Build-Nummer wäre falsch (fetch-depth: 0 im prepare-Job)"
          number="$(git rev-list --count HEAD)"
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || fail "Ungültige Build-Nummer: '$number'"
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          echo "Build-Nummer: $number" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      # OUT-251: Die Notes landen beim Bauen in latest.json/latest-beta.json und sind danach nicht mehr
      # änderbar. Ohne gültige docs/release/notes/<Version>.md (gleich dem CHANGELOG-Eintrag) wird nicht gebaut.
      - name: Release-Notes vor dem Bauen prüfen (OUT-251)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/notes.mjs --check "$VERSION"
      - name: Release-Vertragstests
        run: node --test scripts/release/*.test.mjs tests/release/orchestration.test.mjs

  macos:
    needs: prepare
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      run_tests: true
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  windows:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-windows.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  linux-core:
    needs: [prepare, licenses]
    env:
      OPENSPIDER_UPDATE_BETA: ${{ needs.prepare.outputs.channel == 'beta' && '1' || '0' }}
      OPENSPIDER_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build-Kennung (Hilfe → Über, Debug-Info, Absturzberichte)
        shell: bash
        run: echo "OPENSPIDER_BUILD=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Vollständige Lizenzhinweise aus L01 laden (Pflicht)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-notices
          path: third-party-notices
      - name: L01-Artefakt prüfen
        run: test -s third-party-notices/THIRD_PARTY_NOTICES.txt
      - name: Rust-Toolchain aus rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Linux-CLI mit bestehendem linux-core-Build bauen
        run: timeout 3600s nice -n 10 bash scripts/ci/linux-core.sh release
      - name: CLI-Golden-Smoke (OUT-273)
        run: timeout 3600s nice -n 10 bash scripts/ci/linux-core.sh golden
      - name: CLI-Archiv packen und extrahiert prüfen
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts "$RUNNER_TEMP/linux-cli"
          tar -czf "release-artifacts/openspider_${VERSION}_linux-x86_64.tar.gz" -C target/linux-core openspider -C "$GITHUB_WORKSPACE" LICENSE NOTICE -C "$GITHUB_WORKSPACE/third-party-notices" THIRD_PARTY_NOTICES.txt
          tar -xzf "release-artifacts/openspider_${VERSION}_linux-x86_64.tar.gz" -C "$RUNNER_TEMP/linux-cli"
          "$RUNNER_TEMP/linux-cli/openspider" --version
          "$RUNNER_TEMP/linux-cli/openspider" --help > /dev/null
      - name: Build-Nummer im CLI prüfen (UI-127)
        run: |
          set -euo pipefail
          [[ "$OPENSPIDER_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error title=Build-Nummer::Release-Lauf ohne Build-Nummer"; exit 1; }
          "$RUNNER_TEMP/linux-cli/openspider" --version | grep -F "(Build $OPENSPIDER_BUILD_NUMBER, "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openspider-linux-x86_64
          path: release-artifacts/
          if-no-files-found: error

  assemble:
    needs: [prepare, licenses, macos, windows, linux-core]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openspider-*
          path: incoming
      - name: Vollständige Lizenzhinweise aus L01 laden (Pflicht)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-notices
          path: third-party-notices
      - name: L01-Artefakt prüfen
        run: test -s third-party-notices/THIRD_PARTY_NOTICES.txt
      - name: Distributable Assets sammeln und CLI-Archive vervollständigen
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/assets.mjs incoming release-assets "$VERSION"
          test -s release-assets/openspider.exe
          mkdir -p "$RUNNER_TEMP/windows-cli"
          mv release-assets/openspider.exe "$RUNNER_TEMP/windows-cli/"
          cp LICENSE NOTICE third-party-notices/THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/windows-cli/"
          (cd "$RUNNER_TEMP/windows-cli" && zip "$GITHUB_WORKSPACE/release-assets/openspider_${VERSION}_windows-x86_64.zip" openspider.exe LICENSE NOTICE THIRD_PARTY_NOTICES.txt)
          # Nur eigenständige CLI-Archive umpacken, niemals signierte .app.tar.gz.
          shopt -s nullglob
          for archive in release-assets/openspider_"${VERSION}"_darwin-*.tar.gz; do
            cli_dir="$(mktemp -d "$RUNNER_TEMP/macos-cli.XXXXXX")"
            tar -xzf "$archive" -C "$cli_dir"
            test -s "$cli_dir/openspider"
            cp LICENSE NOTICE third-party-notices/THIRD_PARTY_NOTICES.txt "$cli_dir/"
            tar -czf "$archive" -C "$cli_dir" openspider LICENSE NOTICE THIRD_PARTY_NOTICES.txt
          done
      - name: Release-Notes und Update-Manifeste
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p release-reports
          # OUT-251/OUT-261: update-notes.md (nur CHANGELOG) für die Manifeste und den Update-Dialog,
          # release-notes.md (Download-Kasten + CHANGELOG) ausschließlich als Release-Text.
          node scripts/release/notes.mjs "$VERSION" release-reports/update-notes.md --body release-reports/release-notes.md --repository "$GITHUB_REPOSITORY"
          node scripts/release/manifest.mjs release-assets "$VERSION" "$GITHUB_REPOSITORY" release-reports/update-notes.md "$RELEASE_DATE" --allow-unsigned > release-reports/updater-status.txt
          cat release-reports/updater-status.txt >> "$GITHUB_STEP_SUMMARY"
          # Entwurfshinweise nur in die Actions-Zusammenfassung (und den Bericht), nie in den Release-Text.
          hint() { echo "- $1" | tee -a release-reports/entwurfshinweise.md >> "$GITHUB_STEP_SUMMARY"; }
          printf '\n**Entwurfshinweise (nicht Teil des Release-Texts):**\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f release-assets/latest.json ]]; then
            hint 'unsigniert: keine vollständigen signierten Updater-Artefakte; keine Update-Manifeste.'
          fi
          hint 'Installations-Smoke: separater workflow_call; Entwurf wartet auf erfolgreiche Plattformmatrix und Bytevergleich.'
      - name: Archiv-Kompatibilitäts-Fixture (D01)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node --test tests/fixtures/migrations/node/archive.test.mjs
          mkdir -p "$RUNNER_TEMP/compat-cli"
          tar -xzf "release-assets/openspider_${VERSION}_linux-x86_64.tar.gz" -C "$RUNNER_TEMP/compat-cli"
          node scripts/release/archive-compat-fixture.mjs --version "$VERSION" --out release-reports/compat --cli "$RUNNER_TEMP/compat-cli/openspider"
          tar -czf "release-assets/compat_${VERSION}.tar.gz" -C release-reports/compat "$VERSION"
          echo '- TODO: Offene M2-Paritätspakete vor einer Freigabe prüfen.' | tee -a release-reports/entwurfshinweise.md >> "$GITHUB_STEP_SUMMARY"
      - name: SHA256SUMS über alle Release-Assets
        run: node scripts/release/checksums.mjs release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reports
          path: release-reports/
          if-no-files-found: error

  smoke-installed:
    needs: [macos, windows]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/smoke-installed.yml

  draft:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [prepare, assemble, smoke-installed]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-reports
          path: release-reports
      - name: Veröffentlichte Dateien und versionslose Downloads prüfen (OUT-261)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          # Feste Links releases/latest/download/<Kopie> brauchen beide bytegleichen Kopien samt Prüfsumme.
          for pair in "OpenSpider-macOS.dmg OpenSpider_${VERSION}_universal.dmg" "OpenSpider-Windows-Setup.exe OpenSpider_${VERSION}_x64-setup.exe"; do
            read -r alias source <<< "$pair"
            if [[ ! -s "$source" ]] || ! cmp -s "$alias" "$source"; then
              echo "::error::$alias fehlt oder ist nicht bytegleich mit $source."
              exit 1
            fi
            for name in "$alias" "$source"; do
              line="$(awk -v name="$name" '$2 == name' SHA256SUMS)"
              [[ -n "$line" ]] || { echo "::error::$name fehlt in SHA256SUMS."; exit 1; }
              sha256sum -c --status <<< "$line"
            done
          done
          # Release-Text = Download-Kasten + Notes; Entwurfshinweise stehen nur in der Actions-Zusammenfassung.
          if [[ ! -s ../release-reports/release-notes.md ]] || grep -Eq 'Entwurfshinweis|\bTODO\b|\bSTUB\b' ../release-reports/release-notes.md; then
            echo '::error::Release-Text fehlt oder enthält Entwurfshinweise; diese gehören nur in die Actions-Zusammenfassung.'
            exit 1
          fi
          # Gebaut und geprüft, aber nicht veröffentlicht (Nutzerentscheidung 04.11.2026).
          for name in "OpenSpider_${VERSION}_aarch64.dmg" "OpenSpider_${VERSION}_x64.dmg" \
            "openspider_${VERSION}_darwin-aarch64.tar.gz" "openspider_${VERSION}_darwin-x86_64.tar.gz" \
            OpenSpider_universal.app.tar.gz OpenSpider_universal.app.tar.gz.sig; do
            if [[ -e "$name" ]]; then
              echo "::error::$name darf nicht veröffentlicht werden."
              exit 1
            fi
          done
      - name: Ausschließlich neuen Entwurfs-Release anlegen (D12, K3-04)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Never edit an existing release, especially a published one. API errors also fail closed.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq "$RELEASE_TAG" existing-tags.txt; then
            echo '::error::Release existiert bereits; manuell prüfen, niemals automatisch überschreiben.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease=false --latest=false \
            --title "OpenSpider $RELEASE_TAG" --notes-file release-reports/release-notes.md
          echo 'Nur Entwurf. Veröffentlichung und Setzen als Latest ausschließlich nach Go des Nutzers.' >> "$GITHUB_STEP_SUMMARY"
