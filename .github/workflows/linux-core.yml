name: linux-core

# OUT-273 / M2-V01 (Etappe E0): Kern, CLI und MCP-STDIO auf Linux x86_64 (glibc) ohne Desktop-App.
# Alle Befehle stehen in scripts/ci/linux-core.sh; Skip-Liste (Ziel: leer): scripts/ci/linux-core-skips.txt.

on:
  push:
    # Reine Doku-Commits lösen keinen Lauf aus (K2-67, B3-REL; Muster der Reihe nach, später gewinnt): Markdown, docs/**,
    # website/**, learnings/** und assets bleiben draußen. Ausnahmen, weil Tests oder Jobs diese Dateien lesen: docs/spec,
    # docs/issues (Issue-Katalog-Tests), docs/plan/M2.md (os-parity coverage, Anhang B), docs/plan/*.json und *.toml
    # (Pakete, Status, Filterkataloge), tests/** (u. a. tests/golden/parity/README.md).
    paths: &doc-paths
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!website/**"
      - "!learnings/**"
      - "docs/spec/**"
      - "docs/issues/**"
      - "docs/plan/M2.md"
      - "docs/plan/*.json"
      - "docs/plan/*.toml"
      - "tests/**"
      - "!assets/**"
  pull_request:
    paths: *doc-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # M2.md C5, aber ohne Debuginfo wie ci.yml, spec-coverage-m2.yml und release-macos.yml: Mit line-tables-only belegten die
  # rund 590 Testprogramme die Platte bis auf 0,6 GB (Läufe 42646892161, 42677181224); unter 2 GiB warnt und unter 1 GiB
  # pausiert der Ressourcenschutz der Engine (CRAWL-124) jeden Crawl, 43 Tests scheiterten. Ohne Debuginfo ist ein
  # Testprogramm etwa 44 % kleiner (tab_indexability 272 MB -> 153 MB).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # M2.md C13: kein Schlüsselbund, kein Secret Service; D-Bus-Sitzung wird im Skript entfernt
  OPENSPIDER_SECRET_STORE: memory
  # Nur für den Fallback, wenn der Runner kein Chrome mitbringt: Playwright-Version wie in M2.md C3 (F04 pinnt sie im Lockfile)
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  linux-core:
    name: linux-core (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Runde 11: ubuntu-latest hatte < 1 GB frei, der Ressourcenschutz pausierte Crawls in Tests.
      - name: Speicherplatz schaffen (ungenutzte SDKs des Runners)
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # int-g: mit dem M3-Stand lief die Platte erneut voll ("No space left on device", Lauf 41496422333).
          sudo rm -rf /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /opt/az /usr/local/julia* /opt/microsoft
          # Wie spec-coverage-m2.yml: Go, Ruby und PyPy des Tool-Caches braucht der Job nicht (Python ist das des Systems).
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -n 1

      # Rust laut rust-toolchain.toml (legt M2-F01 an); bis dahin die aktuelle stabile Version wie in ci.yml.
      - name: Rust-Toolchain
        run: |
          if [ -f rust-toolchain.toml ]; then
            rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-core

      - name: rustfmt
        run: scripts/ci/linux-core.sh fmt

      - name: clippy (ohne openspider-desktop)
        run: scripts/ci/linux-core.sh clippy

      # Setzt OPENSPIDER_CHROMIUM für die folgenden Schritte (Rendering-Tests von M2-E05 laufen ohne Änderung mit).
      - name: Chromium headless (ohne Display, ohne xvfb)
        run: scripts/ci/linux-core.sh chromium

      - name: Tests (ohne openspider-desktop, ohne D-Bus)
        run: scripts/ci/linux-core.sh test

      - name: Release-Build openspider
        run: scripts/ci/linux-core.sh release

      - name: CLI-Golden-Smoke mit der Release-Binärdatei
        run: scripts/ci/linux-core.sh golden

      # M2-F02 (OUT-233/OUT-234): stabile Leseschnittstelle der Crawl-Datei. Der Beispielleser scripts/ci/read_api_smoke.py
      # benutzt nur Python-sqlite3 (mode=ro, ohne OpenSpider-Code): abgeschlossene Datei, Datei neben einem laufenden Crawl,
      # unbekannte Version der Leseschnittstelle. Der Test crawlt out-basic-site/out-queue und ruft den Leser auf.
      - name: read-api-smoke (Python sqlite3, ohne OpenSpider-Code)
        env:
          OPENSPIDER_REQUIRE_PYTHON: "1"
        run: |
          python3 --version
          cargo test -p os-cli --test read_api_export --locked -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: openspider-linux-x86_64
          path: |
            target/linux-core/openspider
            target/linux-core/openspider.sha256
          retention-days: 7
          if-no-files-found: error
