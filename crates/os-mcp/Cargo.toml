[package]
name = "os-mcp"
description = "OpenSpider: MCP-Server (STDIO), Werkzeugklassen read/crawl/write/cost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
os-ai.workspace = true
os-engine.workspace = true
os-fetch.workspace = true
axum.workspace = true
getrandom.workspace = true

os-model.workspace = true
os-store.workspace = true
os-analyze.workspace = true
os-export.workspace = true
# M2-F01 (3.2): API-Quellen und Rendering hinter den Werkzeugen (M2-M01); nie os-app
os-integrations.workspace = true
os-render.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
dirs.workspace = true

[[bin]]
# Schlanker Starter nur für die Prozess-Tests von P18/P27 (stdout-Reinheit, rmcp-Client über Kindprozess);
# ausgeliefert wird `openspider mcp` aus os-cli.
name = "openspider-mcp"
path = "src/main.rs"

[dev-dependencies]
os-analyze = { workspace = true, features = ["testing"] }
os-engine = { workspace = true, features = ["testing"] }
os-testsite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
