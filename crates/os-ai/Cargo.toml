[package]
name = "os-ai"
description = "OpenSpider: provider-neutral AI services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
os-model.workspace = true
# C13: K04 must use the shared SecretStoreMut instead of opening keyring directly.
os-fetch.workspace = true
